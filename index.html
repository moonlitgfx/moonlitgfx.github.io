<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Portfolio</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Love+Light&family=Viaoda+Libre&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="YOUR-FAVICON-LINK-HERE">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #161616;
            color: #f2f2f2;
            font-family: "Viaoda Libre", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* centers everything vertically */
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        .header-img {
            width: 100%;
            max-width: 420px;
            margin: 0 auto 30px;
            display: block;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            max-width: 300px;
            margin: 0 auto 30px;
        }

        .nav-button {
            background: #a42f57;
            border: 2px solid #c34a72;
            padding: 20px;
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 0; /* sharp corners */
            transition: 0.3s;
        }

        .nav-button:hover {
            background: #c34a72;
            transform: scale(1.05);
        }

        .title {
            font-family: "Love Light", cursive;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .description {
            max-width: 550px;
            margin: 0 auto;
            padding: 0 15px;
            line-height: 1.5;
            font-size: 0.9rem; /* smaller text */
            text-align: justify;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header Image -->
    <img class="header-img" src="YOUR-HEADER-IMAGE-LINK-HERE" alt="Header Image">

    <!-- 4 Centered Buttons -->
    <div class="button-grid">
        <a class="nav-button" href="#">BLOG</a>
        <a class="nav-button" href="#">RULES</a>
        <a class="nav-button" href="#">REQUESTS</a>
        <a class="nav-button" href="#">EXAMPLES</a>
    </div>

    <!-- Title + Description -->
    <div class="title">TITLE HERE</div>

    <div class="description">
        Your description goes here. This text is smaller, cleaner, and neatly justified for a polished portfolio look. It will stay centered and readable on both desktop and mobile.
    </div>

</div>

</body>
</html>
