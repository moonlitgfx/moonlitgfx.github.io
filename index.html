<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Portfolio</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Coiny&family=Elms+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="YOUR-FAVICON-LINK-HERE">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #161616;
            color: #f2f2f2;
            font-family: "Elms Sans", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        .header-img {
            width: 100%;
            max-width: 420px;
            margin: 0 auto 25px;
            display: block;
        }

        /* Small cute links across the page */
        .link-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-button {
            background: #a42f57;
            border: 2px solid #c34a72;
            padding: 10px 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
            font-size: 0.8rem;
            border-radius: 0; /* sharp corners */
            transition: 0.25s;
            min-width: 70px;
        }

        .nav-button:hover {
            background: #c34a72;
            transform: scale(1.05);
        }

        .title {
            font-family: "Coiny", cursive;
            font-size: 2.6rem;
            margin-bottom: 10px;
        }

        .description {
            max-width: 550px;
            margin: 0 auto;
            padding: 0 15px;
            line-height: 1.5;
            font-size: 0.85rem; /* smaller text */
            text-align: justify;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header Image -->
    <img class="header-img" src="YOUR-HEADER-IMAGE-LINK-HERE" alt="Header Image">

    <!-- Small Cute Links -->
    <div class="link-row">
        <a class="nav-button" href="#">BLOG</a>
        <a class="nav-button" href="#">RULES</a>
        <a class="nav-button" href="#">REQUESTS</a>
        <a class="nav-button" href="#">EXAMPLES</a>
    </div>

    <!-- Title + Description -->
    <div class="title">MOONLITGFX</div>

    <div class="description">
        Your description goes here. This text is smaller, cleaner, and neatly justified for a polished portfolio look. It will stay centered and readable on both desktop and mobile.
    </div>

</div>

</body>
</html>
