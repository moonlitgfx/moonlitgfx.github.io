<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rules</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Coiny&family=Elms+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="YOUR-FAVICON-LINK-HERE">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #161616;
            color: #f2f2f2;
            font-family: "Elms Sans", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 20px;
        }

        .title {
            font-family: "Coiny", cursive;
            font-size: 2.4rem;
            margin-bottom: 20px;
        }

        .rules-text {
            max-width: 600px;
            margin: 0 auto 40px;
            padding: 0 15px;
            line-height: 1.55;
            font-size: 0.85rem;
            text-align: justify;
        }

        .home-button {
            background: #a42f57;
            border: 2px solid #c34a72;
            padding: 12px 20px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 0;
            transition: 0.25s;
        }

        .home-button:hover {
            background: #c34a72;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">RULES</div>

    <div class="rules-text">
        Write all your rules here. The text will stay small, clean, and justified for easy reading.
        This layout is fully responsive, so it will look just as good on mobile as it does on desktop.
        Add as many paragraphs as you want — the spacing will adjust naturally.
    </div>

    <a class="home-button" href="index.html">BACK TO HOME</a>

</div>

</body>
</html>
