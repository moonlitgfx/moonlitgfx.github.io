<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Form</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Coiny&family=Elms+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="YOUR-FAVICON-LINK-HERE">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #161616;
            color: #f2f2f2;
            font-family: "Elms Sans", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 20px;
        }

        .title {
            font-family: "Coiny", cursive;
            font-size: 2.4rem;
            margin-bottom: 25px;
        }

        .description {
            max-width: 600px;
            margin: 0 auto 25px;
            padding: 0 15px;
            line-height: 1.55;
            font-size: 0.85rem;
            text-align: justify;
        }

        form {
            max-width: 600px;
            margin: 0 auto 30px;
            text-align: left;
        }

        label {
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: block;
            color: #c34a72;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            background: #1f1f1f;
            border: 2px solid #a42f57;
            color: #ffffff;
            font-family: "Elms Sans", sans-serif;
            font-size: 0.85rem;
            margin-bottom: 18px;
            border-radius: 0;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .submit-button {
            background: #a42f57;
            border: 2px solid #c34a72;
            padding: 10px 18px;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 0;
            cursor: pointer;
            transition: 0.25s;
        }

        .submit-button:hover {
            background: #c34a72;
            transform: scale(1.05);
        }

        .home-button {
            background: #a42f57;
            border: 2px solid #c34a72;
            padding: 8px 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.75rem;
            border-radius: 0;
            transition: 0.25s;
            display: inline-block;
            margin-top: 10px;
        }

        .home-button:hover {
            background: #c34a72;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">REQUEST FORM</div>

    <div class="description">
        Fill out the form below and your details will be sent to my Tumblr submit page. 
        Everything is formatted to stay clean, centered, and mobile‑friendly.
    </div>

    <!-- FORM -->
    <form action="https://YOUR-TUMBLR-URL.tumblr.com/submit" method="GET">
        <label>Name / Username</label>
        <input type="text" name="name" placeholder="Your name or Tumblr URL">

        <label>Request Type</label>
        <input type="text" name="type" placeholder="What are you requesting?">

        <label>Details</label>
        <textarea name="details" placeholder="Describe your request here..."></textarea>

        <button type="submit" class="submit-button">SEND TO TUMBLR</button>
    </form>

    <a class="home-button" href="index.html">BACK HOME</a>

</div>

</body>
</html>
